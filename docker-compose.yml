version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-tg_shop}
      POSTGRES_USER: ${DB_USER:-tg_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tg_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    restart: always
    command: >
      sh -c "sleep 3 &&
             python manage.py migrate &&
             python manage.py seed_data &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DB_NAME=${DB_NAME:-tg_shop}
      - DB_USER=${DB_USER:-tg_user}
      - DB_PASSWORD=${DB_PASSWORD:-tg_password}
      - DB_HOST=db
      - DB_PORT=5432
      - BOT_TOKEN=${BOT_TOKEN}
      - TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID}
      - WEBAPP_URL=${WEBAPP_URL:-http://localhost:8000}
    depends_on:
      - db

  bot:
    build: .
    restart: always
    command: python manage.py run_bot
    volumes:
      - .:/app
      - media_volume:/app/media
    environment:
      - DEBUG=True
      - DB_NAME=${DB_NAME:-tg_shop}
      - DB_USER=${DB_USER:-tg_user}
      - DB_PASSWORD=${DB_PASSWORD:-tg_password}
      - DB_HOST=db
      - DB_PORT=5432
      - BOT_TOKEN=${BOT_TOKEN}
      - TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID}
      - WEBAPP_URL=${WEBAPP_URL:-http://localhost:8000}
    depends_on:
      - db
      - web

volumes:
  postgres_data:
  media_volume:
