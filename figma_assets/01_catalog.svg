  <text x="36" y="792" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Корзина (1)</text>
  <text x="357" y="792" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="end">134 990 ₽ →</text>
