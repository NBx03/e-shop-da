  <path d="M34 87L30 83M31.5 79.5C31.5 82.2614 29.2614 84.5 26.5 84.5C23.7386 84.5 21.5 82.2614 21.5 79.5C21.5 76.7386 23.7386 74.5 26.5 74.5C29.2614 74.5 31.5 76.7386 31.5 79.5Z" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <text x="44" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" fill="#94A3B8">Поиск техники (iPhone, MacBook, Sony)...</text>

