  <text x="196" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">VoltStore ⚡</text>
  <circle cx="365" cy="30" r="3" fill="#94A3B8"/>
  <circle cx="373" cy="30" r="3" fill="#94A3B8"/>
  <circle cx="381" cy="30" r="3" fill="#94A3B8"/>

  <!-- Search Input -->
