    <rect x="80" y="120" width="112" height="34" rx="17" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="136" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="500" fill="#334155" text-anchor="middle">Смартфоны</text>

