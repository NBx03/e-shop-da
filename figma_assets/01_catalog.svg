    <text x="211" y="354" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="700" fill="#0F172A">Nothing Phone (2)</text>
    <text x="211" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="#64748B">12/256GB Dark Grey</text>
