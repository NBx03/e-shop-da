    <text x="211" y="644" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="#64748B">Hi-Res ANC Wireless</text>
    <text x="211" y="670" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="15" font-weight="800" fill="#0F172A">36 990 ₽</text>
    <rect x="211" y="686" width="158" height="34" rx="10" fill="#2481CC"/>
    <text x="290" y="707" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">В корзину</text>
